name: Go CI

on:
  push:
    branches: [main, adhitiad_gpt]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goarch: amd64
            native_test: true
          - os: ubuntu-latest
            goarch: amd64
            native_test: true
          - os: ubuntu-24.04-arm
            goarch: arm64
            native_test: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true
      - name: Verify architecture
        shell: bash
        run: |
          test "$(go env GOARCH)" = "${{ matrix.goarch }}"
      - name: Verify Go formatting
        shell: bash
        run: |
          files=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$files" ]; then
            echo "Go files need gofmt:"
            echo "$files"
            while IFS= read -r file; do
              [ -z "$file" ] || gofmt -d "$file"
            done <<< "$files"
            exit 1
          fi
      - name: List packages
        run: go list ./...
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race tests (Linux only)
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Benchmark smoke (Linux AMD64)
        if: runner.os == 'Linux' && matrix.goarch == 'amd64'
        run: go test -run '^ -bench '^BenchmarkTensor' -benchtime=1x -benchmem ./src/tensor
