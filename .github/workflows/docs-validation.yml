name: Documentation validation

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.yaml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.yaml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check trailing whitespace and conflict markers
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '^(<<<<<<< |=======|>>>>>>> )' -- '*.md' '*.yml' '*.yaml'; then
            echo "Merge conflict markers found."
            exit 1
          fi
          if git grep -n '[[:blank:]]$' -- '*.md' '*.yml' '*.yaml'; then
            echo "Trailing whitespace found."
            exit 1
          fi
      - name: Validate YAML
        shell: bash
        run: |
          set -euo pipefail
          find .github -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 |
            while IFS= read -r -d '' file; do
              ruby -e 'require "yaml"; YAML.load_file(ARGV.fetch(0))' "$file"
              echo "OK $file"
            done
