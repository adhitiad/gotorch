name: Documentation validation

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.yaml"
      - ".github/workflows/docs-validation.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.yml"
      - "**/*.yaml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check trailing whitespace and conflict markers
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '^(<<<<<<< |=======|>>>>>>> )' -- '*.md' '*.yml' '*.yaml'; then
            echo "Merge conflict markers found."
            exit 1
          fi
          if git grep -n '[[:blank:]]$' -- '*.md' '*.yml' '*.yaml'; then
            echo "Trailing whitespace found."
            exit 1
          fi
      - name: Validate YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          files = list(Path(".github").rglob("*.yml")) + list(Path(".github").rglob("*.yaml"))
          for path in files:
              with path.open(encoding="utf-8") as stream:
                  yaml.safe_load(stream)
              print(f"OK {path}")
          PY
