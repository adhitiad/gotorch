name: Documentation
description: Report unclear, missing, or incorrect documentation.
title: "[docs]: "
labels: ["type: docs", "status: triage"]
body:
  - type: input
    id: location
    attributes:
      label: Page or file
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested correction
